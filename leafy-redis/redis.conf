# --- [네트워크 설정] ---
# 모든 IP에서의 접속 허용 (Docker 내부 통신을 위해 필수)
bind 0.0.0.0

# 기본 포트
port 6379

# 보호 모드 해제 (Docker 네트워크 내부에서만 통신하므로 끔)
# 비밀번호(requirepass)가 있으면 안전하지만, 연결 이슈 방지를 위해 보통 컨테이너에선 끕니다.
protected-mode no

# --- [메모리 설정] ---
# 최대 메모리 설정 (EC2 프리티어 메모리가 적으므로 256mb~512mb 권장)
maxmemory 512mb

# 메모리가 꽉 찼을 때 삭제 정책 (LRU: 가장 오래 안 쓴 데이터부터 삭제)
maxmemory-policy allkeys-lru

# --- [데이터 저장(Persistence) 설정] ---
# 데이터를 디스크에 저장할지 여부 (AOF 방식 권장)
# yes로 설정하면 Redis가 재부팅되어도 데이터가 날아가지 않습니다.
appendonly yes

# 저장 파일명
appendfilename "appendonly.aof"

# 데이터 저장 주기 (everysec: 1초마다 저장 - 성능과 안전성의 타협점)
appendfsync everysec

# --- [기타] ---
# 로그 레벨 (notice가 적당함)
loglevel notice

server {
    listen       80;
    server_name  _;

    location ~* \.(php|aspx|asp|jsp|bak|sql|env|yaml|ini|log|key|crt|phpinfo)$ {
        # 1. index.html로 가지 못하게 즉시 404 응답
        return 404;

        # 2. 또는 공격자로 간주하고 403 차단
        # deny all;

        # 3. 로그도 남기지 않아 깨끗하게 관리
        access_log off;
        log_not_found off;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.html;

        try_files $uri $uri/ /index.html;
    }


    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 백엔드 서버로 요청을 전달
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
    }

    location ~ /\. {
            deny all;
            access_log off; # 로그도 남기지 마 (지저분하니까)
            log_not_found off;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}

# 최초 EC2 셋업을 위한 워크플로우 파일
# .github/workflows/initial-setup.yml
name: Initial EC2 Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup EC2 instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            # --- 1. Docker 및 Docker Compose 설치 ---
            if ! command -v docker &> /dev/null; then
                echo "Installing Docker..."
                sudo apt-get update && sudo apt-get install -y docker.io
                sudo systemctl start docker && sudo systemctl enable docker
                sudo usermod -aG docker ${{ secrets.EC2_USERNAME }}
                sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                sudo chmod +x /usr/local/bin/docker-compose
            fi

            # --- 2. docker-compose.yml 파일 생성 ---
            echo "Creating docker-compose.yml with variables"
            cat << EOF > docker-compose.yml

            services:
              leafy-postgres:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/leafy-postgres:latest
                ports:
                  - "127.0.0.1:5432:5432"
                environment:
                  - POSTGRESQL_USERNAME=${{ secrets.DATASOURCE_USERNAME }}
                  - POSTGRESQL_PASSWORD=${{ secrets.DATASOURCE_PASSWORD }}
                  - POSTGRESQL_DATABASE=${{ secrets.DATASOURCE_DB_NAME }}
                  - POSTGRESQL_POSTGRES_PASSWORD=${{ secrets.DATASOURCE_ADMIN_PASSWORD }}
                  # REPMGR 관련 변수는 삭제함 (일반 이미지 사용 시 불필요)
                volumes:
                  - leafy_data:/bitnami/postgresql  # [수정] Bitnami 데이터 경로!
                restart: always
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${{ secrets.DATASOURCE_USERNAME }} -d ${{ secrets.DATASOURCE_DB_NAME }}"]
                  interval: 5s
                  timeout: 5s
                  retries: 5

              redis:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/leafy-redis:latest
                container_name: redis-server
                command: redis-server --requirepass ${{ secrets.REDIS_PASSWORD }}
                restart: always
                volumes:
                  - redis_data:/data
                networks:
                  - default
                healthcheck:
                  test: [ "CMD", "redis-cli", "-a", "${{ secrets.REDIS_PASSWORD }}", "ping" ]
                  interval: 10s
                  timeout: 5s
                  retries: 5
            
              leafy-backend:
                image: \${BACKEND_IMAGE_TAG}
                restart: on-failure
                environment:
                  - SPRING_DATASOURCE_URL=jdbc:postgresql://leafy-postgres:5432/${{ secrets.DATASOURCE_DB_NAME }}
                  - SPRING_DATASOURCE_USERNAME=${{ secrets.DATASOURCE_USERNAME }}
                  - SPRING_DATASOURCE_PASSWORD=${{ secrets.DATASOURCE_PASSWORD }}
            
                  # Redis 설정
                  - SPRING_DATA_REDIS_HOST=redis
                  - SPRING_DATA_REDIS_PORT=6379
                  - SPRING_DATA_REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            
                  # 기타 설정
                  - DISCORD_500_WEBHOOK_URI=${{ secrets.DISCORD_500_WEBHOOK_URI }}
                  - DISCORD_400_WEBHOOK_URI=${{ secrets.DISCORD_400_WEBHOOK_URI }}
                  - JWT_SECRET=${{ secrets.JWT_SECRET }}
                  - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
                depends_on:
                  leafy-postgres:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
            
              leafy-front:
                image: \${FRONTEND_IMAGE_TAG}
                restart: on-failure
                ports:
                  - "80:80"
                environment:
                    - BACKEND_HOST=leafy-backend
                    - BACKEND_PORT=8080
                depends_on:
                  - leafy-backend
            
            volumes:
              leafy_data:
              redis_data:
            EOF

            echo "Creating initial .env file"
            # .env 파일에는 이미지 태그 정보만 있으면 됩니다.
            # DB 정보는 위 docker-compose.yml에 직접 주입되므로 여기서 뺍니다. (혼동 방지)
            cat << EOF > .env
            BACKEND_IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/leafy-backend:latest
            FRONTEND_IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/leafy-frontend:latest
            EOF
            
            # --- 3. 서비스 시작 ---
            echo "Starting services..."
            sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
            sudo docker-compose pull
            sudo docker-compose up -d
            
            echo "Initial setup complete."

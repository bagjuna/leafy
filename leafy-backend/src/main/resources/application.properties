# Postgresql Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_URL:localhost}:${DB_PORT:5432}/${POSTGRES_DB:mydb}
spring.datasource.username=${POSTGRES_USER:myuser}
spring.datasource.password=${POSTGRES_PASSWORD:mypassword}

# Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
# Initialize database on startup

spring.sql.init.mode=always
management.endpoints.web.exposure.include=health,info
# Cgroup ?? ?? (2025-10-28 ?? ??)
management.metrics.enable.system.cpu.usage=false
management.metrics.enable.process.cpu.usage=false

